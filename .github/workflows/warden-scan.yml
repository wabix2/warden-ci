name: Warden security gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  warden:
    name: Warden scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Collect changed files
        id: diff
        run: git diff --unified=0 "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > warden.patch
      - name: Run Warden API gate
        env:
          WARDEN_URL: ${{ secrets.WARDEN_URL }}
          WARDEN_API_TOKEN: ${{ secrets.WARDEN_API_TOKEN }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          node scripts/warden-scan.mjs warden.patch
          scan_exit_code=$?
          set -e

          report_url="https://warden-ci-dvk5.onrender.com/dashboard"
          if [ -f warden-report-url.txt ]; then
            report_url="$(cat warden-report-url.txt)"
          fi

          {
            echo "## Warden security gate"
            echo ""
            echo "[Open the customer-facing report]($report_url)"
            echo ""
            echo "[Upgrade to Warden CI Pro](https://warden-ci-dvk5.onrender.com/subscribe?plan=pro)"
          } >> "$GITHUB_STEP_SUMMARY"

          exit $scan_exit_code
