name: Warden security gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  warden:
    name: Warden scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Collect changed files
        id: diff
        run: git diff --unified=0 "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > warden.patch
      - name: Run Warden API gate
        env:
          WARDEN_URL: ${{ secrets.WARDEN_URL }}
          WARDEN_API_TOKEN: ${{ secrets.WARDEN_API_TOKEN }}
          WARDEN_REPOSITORY_ID: ${{ github.repository_id }}
          WARDEN_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          node scripts/warden-scan.mjs warden.patch
          scan_exit_code=$?
          set -e

                   {
            echo "## Warden security gate"
            echo ""
            if [ -f warden-report-url.txt ]; then
              report_url="$(cat warden-report-url.txt)"
              echo "<a href=\"$report_url\">Open the customer-facing report</a>"
            else
              echo "_A per-run report wasn't available for this scan._"
            fi
            echo ""
            echo "<a href=\"https://warden-ci-dvk5.onrender.com/subscribe?owner=${{ github.repository_owner }}&plan=pro\" target=\"_blank\" rel=\"noopener noreferrer\">Upgrade to Warden CI Pro</a>"
          } >> "$GITHUB_STEP_SUMMARY"
