name: Warden security gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  warden:
    name: Warden scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Collect changed files
        id: diff
        run: git diff --unified=0 "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > warden.patch
      - name: Run Warden API gate
        env:
          WARDEN_URL: ${{ secrets.WARDEN_URL }}
          WARDEN_PUBLIC_URL: ${{ vars.WARDEN_PUBLIC_URL }}
          WARDEN_API_TOKEN: ${{ secrets.WARDEN_API_TOKEN }}
        run: |
          node scripts/warden-scan.mjs warden.patch
          {
            echo "## Warden security gate"
            echo ""
            echo "[Open the customer-facing report](${WARDEN_PUBLIC_URL}/details?runId=${{ github.run_id }})"
            echo ""
            echo "Private-repository scanning and verified remediation require [Warden CI Pro](${WARDEN_PUBLIC_URL}/upgrade)"
          } >> "$GITHUB_STEP_SUMMARY"
