<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Security report — Warden CI</title><style>body{font-family:system-ui,sans-serif;background:#090d12;color:#e5e7eb;margin:0;padding:32px}main{max-width:960px;margin:auto}header{border-bottom:1px solid #263241;padding-bottom:24px;margin-bottom:24px}h1{font-size:28px}h2{font-size:18px}.muted{color:#94a3b8}.error{padding:16px;border:1px solid #7f1d1d;background:#2a1115;color:#fecaca}.meta,.finding{border:1px solid #263241;border-radius:8px;padding:16px;margin-top:12px;background:#111821}.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}.label{font-size:12px;color:#94a3b8;text-transform:uppercase}.finding h3{margin:6px 0}.finding pre{white-space:pre-wrap;font:inherit}.severity{font-weight:700}.critical,.high{color:#fca5a5}.medium{color:#fcd34d}.low{color:#93c5fd}</style></head>
<body><main><header><p class="muted">Warden CI / Security report</p><h1 id="title">Loading report…</h1><p id="subtitle" class="muted"></p></header><section id="content" class="muted">Verifying your GitHub session and loading the authorized report.</section></main><script>
const escapeHtml=(value)=>String(value??"").replace(/[&<>\"']/g,(char)=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[char]));
const runId=new URLSearchParams(location.search).get("runId");
const content=document.getElementById("content");
fetch(`/api/runs/${encodeURIComponent(runId||"")}`,{credentials:"same-origin"}).then(async response=>{const body=await response.json().catch(()=>({}));if(!response.ok)throw new Error(body.error||"Could not load report");return body.run;}).then(run=>{document.getElementById("title").textContent=`Run ${run.id}`;document.getElementById("subtitle").textContent=run.repository?`${run.repository}${run.pullRequestNumber?` · pull request #${run.pullRequestNumber}`:""}`:"Repository context unavailable";content.innerHTML=`<div class="meta"><div><div class="label">Scanned</div><div>${escapeHtml(run.scanTimestamp||"Unavailable")}</div></div><div><div class="label">Ecosystem</div><div>Not recorded by this scan</div></div><div><div class="label">Packages / findings</div><div>Not recorded / ${escapeHtml(run.findingsCount)}</div></div><div><div class="label">Verdict</div><div>${escapeHtml(run.verdict||"Unavailable")}</div></div><div><div class="label">Validation</div><div>${escapeHtml(run.status)}</div></div></div><h2>Findings</h2>${run.findings.length?run.findings.map(f=>`<article class="finding"><div class="severity ${escapeHtml(f.severity)}">${escapeHtml(f.severity)}</div><h3>${escapeHtml(f.title)}</h3><p>${escapeHtml(f.message)}</p>${f.filePath?`<p class="muted">${escapeHtml(f.filePath)}${f.lineNumber?`:${escapeHtml(f.lineNumber)}`:""}</p>`:""}<p><strong>Recommended remediation:</strong> ${escapeHtml(f.remediation||"Unavailable")}</p><p class="muted">Status: ${escapeHtml(f.status)}</p></article>`).join(""):"<p class='muted'>No findings were recorded for this run.</p>"}`;}).catch(error=>{document.getElementById("title").textContent="Report unavailable";content.innerHTML=`<div class="error">${escapeHtml(error.message)}</div>`;});
</script></body></html>
